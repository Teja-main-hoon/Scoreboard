<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.google.com https://*.googleapis.com;">
    <title>Team Scores Overlay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: transparent;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding: 0;
            padding-bottom: 0;
        }

        /* --- Voice Feedback Animations --- */
        @keyframes voice-listen-glow {
            0%, 100% {
                box-shadow: 0 0 10px rgba(6, 182, 212, 0.5), inset 0 0 10px rgba(6, 182, 212, 0.2) !important;
                border-color: rgba(6, 182, 212, 0.6) !important;
            }
            50% {
                box-shadow: 0 0 25px rgba(6, 182, 212, 0.9), inset 0 0 15px rgba(6, 182, 212, 0.4) !important;
                border-color: rgba(6, 182, 212, 0.9) !important;
            }
        }

        @keyframes voice-success-flash {
            0% {
                box-shadow: 0 0 30px rgba(74, 222, 128, 1) !important;
                border-color: rgba(74, 222, 128, 1) !important;
            }
            100% {
                box-shadow: 0 -5px 20px rgba(0, 0, 0, 0.3) !important;
                border-color: rgba(255, 255, 255, 0.2) !important;
            }
        }

        @keyframes voice-failure-flash {
            0% {
                box-shadow: 0 0 30px rgba(239, 68, 68, 1) !important;
                border-color: rgba(239, 68, 68, 1) !important;
            }
            100% {
                box-shadow: 0 -5px 20px rgba(0, 0, 0, 0.3) !important;
                border-color: rgba(255, 255, 255, 0.2) !important;
            }
        }

        @keyframes mic-record-pulse {
            0%, 100% {
                background: rgba(239, 68, 68, 0.8) !important;
                box-shadow: 0 0 6px rgba(239, 68, 68, 0.8) !important;
            }
            50% {
                background: rgba(239, 68, 68, 0.3) !important;
                box-shadow: 0 0 14px rgba(239, 68, 68, 0.4) !important;
            }
        }

        .scoreboard-container.voice-listening {
            animation: voice-listen-glow 1.5s infinite ease-in-out !important;
        }

        .scoreboard-container.voice-success {
            animation: voice-success-flash 1s ease-out !important;
        }

        .scoreboard-container.voice-failure {
            animation: voice-failure-flash 1s ease-out !important;
        }

        .control-btn#voiceToggleBtn.active {
            animation: mic-record-pulse 1.2s infinite ease-in-out !important;
            color: white !important;
        }

        .scoreboard-container {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 0;
            padding: 0 10px;
            box-shadow: 0 -5px 20px rgba(0, 0, 0, 0.3);
            width: 100%;
            height: 100%;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-bottom: none;
            border-left: none;
            border-right: none;
            position: relative;
            display: flex;
            align-items: center;
            -webkit-app-region: drag;
        }



        .teams-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: nowrap;
            width: 100%;
        }

        .team-item {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.15);
            padding: 4px 8px;
            border-radius: 6px;
            transition: all 0.3s ease;
            border-top: none;
            border-bottom: 2px solid transparent;
            flex: 1;
            min-width: 0;
            justify-content: center;
        }

        .team-item:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-3px);
        }

        .team-item.updated {
            border-bottom-color: #4ade80;
            animation: pulse 0.5s ease;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: translateY(-3px) scale(1);
            }

            50% {
                transform: translateY(-3px) scale(1.05);
            }
        }

        .team-name {
            color: white;
            font-size: 13px;
            font-weight: 600;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
            margin-bottom: 0;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            min-width: 0;
        }

        .team-score {
            color: white;
            font-size: 18px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.2);
            padding: 2px 6px;
            border-radius: 4px;
            min-width: 30px;
            text-align: center;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        }

        .status-indicator {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4ade80;
            box-shadow: 0 0 10px #4ade80;
            animation: blink 2s infinite;
        }

        .status-indicator.error {
            background: #ef4444;
            box-shadow: 0 0 10px #ef4444;
        }

        .last-updated {
            display: none;
            /* User requested removal to save real estate */
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        .loading {
            text-align: center;
            color: white;
            padding: 20px;
        }

        .error-message {
            color: #fee2e2;
            text-align: center;
            padding: 10px;
            font-size: 14px;
            background: rgba(239, 68, 68, 0.2);
            border-radius: 5px;
            margin-top: 10px;
        }

        .window-controls {
            position: absolute;
            top: 5px;
            right: 5px;
            display: flex;
            gap: 5px;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        /* Show controls only when mouse is over the overlay */
        .scoreboard-container:hover .window-controls {
            opacity: 1;
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: background 0.2s;
            -webkit-app-region: no-drag;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        .control-btn.close:hover {
            background: #ef4444;
        }

        .control-btn.font-size-btn {
            font-size: 11px;
            font-weight: bold;
            width: 28px;
        }

        .setup-panel {
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
            font-size: 14px;
            font-weight: 600;
        }

        .setup-input {
            width: 50px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            color: white;
            padding: 4px 8px;
            text-align: center;
            font-weight: bold;
            -webkit-app-region: no-drag;
        }

        .url-input {
            width: 200px;
            text-align: left;
            font-weight: normal;
            font-size: 12px;
            flex-grow: 1;
            /* Take available space */
        }

        .setup-btn {
            background: #4ade80;
            border: none;
            color: #064e3b;
            padding: 4px 12px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            -webkit-app-region: no-drag;
        }

        .setup-btn:hover {
            background: #22c55e;
        }

        .rank-badge {
            font-size: 10px;
            font-weight: 800;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: -4px;
            z-index: 10;
            box-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
            display: none;
            /* Hidden by default */
        }

        /* Option 1 Podium Cards */
        .team-item.rank-1-card {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.8) 0%, rgba(253, 185, 49, 0.8) 100%);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
            transform: scale(1.05);
            /* Slight size bump makes it pop */
            z-index: 2;
        }

        .team-item.rank-1-card .team-name {
            color: #422800;
            text-shadow: none;
        }

        .team-item.rank-1-card .team-score {
            background: rgba(0, 0, 0, 0.4);
        }

        .team-item.rank-2-card {
            background: linear-gradient(135deg, rgba(224, 224, 224, 0.8) 0%, rgba(189, 189, 189, 0.8) 100%);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 2px 10px rgba(224, 224, 224, 0.2);
        }

        .team-item.rank-2-card .team-name {
            color: #212121;
            text-shadow: none;
        }

        .team-item.rank-2-card .team-score {
            background: rgba(0, 0, 0, 0.3);
        }

        .team-item.rank-3-card {
            background: linear-gradient(135deg, rgba(205, 127, 50, 0.8) 0%, rgba(160, 82, 45, 0.8) 100%);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 2px 10px rgba(205, 127, 50, 0.2);
        }

        .team-item.rank-3-card .team-name {
            color: #fff;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }

        .rank-1 {
            background: linear-gradient(135deg, #FFD700 0%, #FDB931 100%);
            color: #8a6d0b;
            border: 1px solid #fff;
            display: flex;
        }

        .rank-2 {
            background: linear-gradient(135deg, #E0E0E0 0%, #BDBDBD 100%);
            color: #424242;
            border: 1px solid #fff;
            display: flex;
        }

        .rank-3 {
            background: linear-gradient(135deg, #CD7F32 0%, #A0522D 100%);
            color: #3E1D0E;
            border: 1px solid #fff;
            display: flex;
        }

        /* Timer Styles */
        .timer-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            width: 100%;
            height: 100%;
            padding: 0 20px;
        }

        .timer-display {
            color: white;
            font-size: 36px;
            font-weight: bold;
            font-variant-numeric: tabular-nums;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.4);
            letter-spacing: 2px;
            display: flex;
            align-items: center;
        }

        .timer-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .timer-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            padding: 4px 12px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
            -webkit-app-region: no-drag;
        }

        .timer-btn:hover {
            background: rgba(255, 255, 255, 0.35);
        }

        .timer-btn.start {
            background: rgba(74, 222, 128, 0.3);
            border-color: #4ade80;
        }
        .timer-btn.start:hover {
            background: rgba(74, 222, 128, 0.5);
        }
        
        .timer-btn.pause {
            background: rgba(250, 204, 21, 0.3);
            border-color: #facc15;
        }
        .timer-btn.pause:hover {
            background: rgba(250, 204, 21, 0.5);
        }

        .timer-input {
            width: 40px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            text-align: center;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            font-variant-numeric: tabular-nums;
            -webkit-app-region: no-drag;
        }
        
        /* Hide arrows from number input */
        .timer-input::-webkit-outer-spin-button,
        .timer-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .bg-timer-finished {
            /* Override the purple gradient with a pleasing pulsating red gradient */
            animation: pulse-bg-red 1.5s infinite;
        }

        @keyframes pulse-bg-red {
            0%, 100% {
                background: linear-gradient(135deg, rgba(239, 68, 68, 0.9) 0%, rgba(185, 28, 28, 0.9) 100%);
            }
            50% {
                background: linear-gradient(135deg, rgba(248, 113, 113, 0.9) 0%, rgba(220, 38, 38, 0.9) 100%);
            }
        }

        /* Vertical/Sidebar Mode Styles - Triggered by aspect ratio < 1 (taller than wide) */
        @media (max-aspect-ratio: 1/1) {
            .scoreboard-container {
                flex-direction: column;
                width: 100% !important;
                height: 100% !important;
                padding: 20px 10px;
                justify-content: flex-start;
                gap: 15px;
                border-top: none;
                border-left: 2px solid rgba(255, 255, 255, 0.2);
            }

            .teams-row {
                flex-direction: column;
                height: auto;
                gap: 12px !important;
            }

            .team-item {
                width: 100%;
                max-width: none;
                padding: 10px !important;
            }

            .team-name {
                font-size: 16px !important;
                text-align: left;
            }

            .team-score {
                font-size: 20px !important;
                min-width: 45px !important;
            }

            .timer-container {
                flex-direction: column;
                gap: 10px;
            }

            /* Inhibit hover transform in vertical mode to prevent overlapping */
            .team-item:hover {
                transform: translateX(5px);
            }
        }

        /* Update Bar indicator */
        .team-score {
            position: relative;
        }

        .update-indicator {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 4px;
            background: #4ade80;
            border-radius: 2px;
            box-shadow: 0 0 8px #4ade80;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .update-indicator.active {
            opacity: 1;
            animation: bar-pulse 1s infinite;
        }

        @keyframes bar-pulse {
            0%, 100% { opacity: 1; transform: translateX(-50%) scaleX(1); }
            50% { opacity: 0.8; transform: translateX(-50%) scaleX(1.1); }
        }
    </style>
</head>

<body>
    <div class="scoreboard-container">
        <div class="window-controls">
            <button class="control-btn" id="sidebarToggleBtn" title="Toggle Sidebar (10s) - (S)">📋</button>
            <button class="control-btn" id="toggleModeBtn" title="Toggle Timer/Scoreboard">⏱️</button>
            <button class="control-btn" id="voiceToggleBtn" title="Voice Scoring Input (Hold/Click V)">🎙️</button>
            <button class="control-btn font-size-btn" id="fontDecreaseBtn" title="Decrease text size">A−</button>
            <button class="control-btn font-size-btn" id="fontIncreaseBtn" title="Increase text size">A+</button>
            <button class="control-btn" id="minimizeBtn" title="Minimize">−</button>
            <button class="control-btn close" id="closeBtn" title="Close">×</button>
        </div>
        <div class="status-indicator" id="statusIndicator"></div>
        <div class="last-updated" id="lastUpdated"></div>
        <!-- Header removed for compact mode -->

        <!-- Setup Panel -->
        <div id="setupPanel" class="setup-panel">
            <input type="text" id="urlInput" class="setup-input url-input" placeholder="Paste Apps Script URL here">
            <label for="teamCount">Teams:</label>
            <input type="number" id="teamCount" class="setup-input" value="8" min="2" max="12">
            <button id="startBtn" class="setup-btn">START</button>
        </div>

        <div id="scoreboardContent" class="teams-row" style="display: none;">
            <div class="loading" style="padding:0">Loading...</div>
        </div>
        
        <!-- Timer Panel -->
        <div id="timerContent" class="timer-container" style="display: none;">
            <div class="timer-controls">
                <input type="number" id="timerMins" class="timer-input" value="05" min="0" max="5">
                <span style="color:white; font-weight:bold;">:</span>
                <input type="number" id="timerSecs" class="timer-input" value="00" min="0" max="59">
            </div>
            <div class="timer-display" id="timerDisplay">05:00</div>
            <div class="timer-controls">
                <button id="timerStartBtn" class="timer-btn start">Start</button>
                <button id="timerPauseBtn" class="timer-btn pause" style="display: none;">Pause</button>
                <button id="timerResetBtn" class="timer-btn">Reset</button>
            </div>
        </div>

        <div id="errorMessage" class="error-message" style="display: none;"></div>
    </div>

    <script>
        // Configuration
        const CONFIG = {
            // Google Apps Script Web App URL
            appsScriptUrl: 'https://script.google.com/macros/s/AKfycbxc4feV9jNT4FqOLxPHkT2Z7zA7S3w2nNbRnOn0LLiIo6a9rHpjyuJakj3jLT5hucwOxA/exec',
            refreshInterval: 500, // Refresh every 0.5 seconds
            teams: [] // Will be populated dynamically
        };

        let currentScores = {};
        let isInitialLoad = true;

        // Initialize (Show Setup first)
        function init() {
            document.getElementById('startBtn').addEventListener('click', startApp);

            // Load saved URL
            const savedUrl = localStorage.getItem('appsScriptUrl') || CONFIG.appsScriptUrl;
            if (savedUrl) {
                document.getElementById('urlInput').value = savedUrl;
            }
        }

        async function startApp() {
            const countInput = document.getElementById('teamCount');
            const urlInput = document.getElementById('urlInput');
            const count = parseInt(countInput.value) || 8;
            let url = urlInput.value.trim();

            // Validate URL
            if (!url) {
                alert("Please enter the Google Sheet or Apps Script URL.");
                return;
            }

            // Smart URL Conversion
            url = transformUrl(url);

            if (!url.startsWith('https://script.google.com') && !url.includes('docs.google.com/spreadsheets')) {
                alert("Invalid URL. Please use:\n1. The main Google Sheet URL (from address bar)\n2. Ensure Sheet is shared with 'Anyone with the link can view'");
                return;
            }

            // Warning for "Publish to Web" links
            if (url.includes('/d/e/')) {
                const proceed = confirm("⚠️ PERFORMANCE WARNING ⚠️\n\nYou are using a 'Publish to Web' link.\nGoogle updates these links once every 5 minutes.\n\nFor INSTANT updates (1-2 seconds), please use the main Google Sheet URL (from your address bar) and share with 'Anyone with the link'.\n\nDo you want to continue with slow updates?");
                if (!proceed) return;
            }

            // Save & Update Configuration
            localStorage.setItem('appsScriptUrl', url);
            CONFIG.appsScriptUrl = url;

            if (count < 2 || count > 12) {
                // Show simple error or just reset to limits
                if (count < 2) countInput.value = 2;
                if (count > 12) countInput.value = 12;
                return;
            }

            // Generate teams
            CONFIG.teams = Array.from({ length: count }, (_, i) => `Team${i + 1}`);

            // Apply font/layout scaling based on team count
            applyDynamicScaling();

            // Switch UI
            document.getElementById('setupPanel').style.display = 'none';
            document.getElementById('scoreboardContent').style.display = 'flex';

            // Start fetching
            await loadScores();
            setInterval(loadScores, CONFIG.refreshInterval);
        }

        async function loadScores() {
            try {
                if (!CONFIG.appsScriptUrl) {
                    showError('Please configure the Google Apps Script URL.');
                    return;
                }

                // Fetch data (now returns ordered array of {name, score})
                const teamsData = await fetchScores();

                // Normalize scores and calculate ranks
                const scoresObj = {};

                // CRITIAL CHANGE: Use Index-based mapping (Row 1 -> Team 1)
                // This ignores what the team is actually named in the sheet for mapping purposes
                const displayNames = {};
                CONFIG.teams.forEach((configTeamName, index) => {
                    if (index < teamsData.length) {
                        const row = teamsData[index];
                        scoresObj[configTeamName] = row.score;
                        displayNames[configTeamName] = row.name;
                    } else {
                        scoresObj[configTeamName] = 0;
                        displayNames[configTeamName] = configTeamName;
                    }
                });

                // Calculate ranks (Dense)
                const sortedUniqueScores = [...new Set(Object.values(scoresObj))].sort((a, b) => b - a);
                const teamRanks = {};
                Object.keys(scoresObj).forEach(team => {
                    const score = scoresObj[team];
                    teamRanks[team] = sortedUniqueScores.indexOf(score) + 1;
                });

                // Sort teams by score for display
                const sortedTeams = CONFIG.teams.slice().sort((a, b) => {
                    return (scoresObj[b] || 0) - (scoresObj[a] || 0);
                });

                if (hasScoresChanged(scoresObj)) {
                    updateDisplay(scoresObj, teamRanks, sortedTeams, displayNames);
                }

                updateStatusIndicator(true);
                hideError();
            } catch (error) {
                console.error('Error loading scores:', error);
                updateStatusIndicator(false);
                // Clean error message
                showError(error.message);
            }
        }

        // ... helpers ...

        /**
         * Dynamically scales scoreboard and timer elements based on team count
         * and the current window dimensions (width/height) to perfectly fill the screen.
         */
        function applyDynamicScaling() {
            const countInput = document.getElementById('teamCount');
            const count = (CONFIG.teams && CONFIG.teams.length) || (countInput ? parseInt(countInput.value) : 8) || 8;
            const n = Math.max(2, Math.min(12, count));

            // Linear interpolation helper
            const lerp = (min, max, t) => min + (max - min) * t;
            const t = (n - 2) / (12 - 2); // 0 at 2 teams, 1 at 12 teams

            const W = window.innerWidth;
            const H = window.innerHeight;
            const isVertical = H > W;

            // Base sizes before scaling - significantly bumped for high legibility
            const baseNameFontSize  = lerp(16, 11,  t); // 16px → 11px
            const baseScoreFontSize = lerp(22, 15, t); // 22px → 15px
            const baseItemPadding   = lerp(5, 2.5, t); // 5px → 2.5px
            const baseRowGap        = lerp(12, 6, t);  // 12px → 6px
            const baseScoreMinWidth = lerp(36, 26, t); // 36px → 26px
            const baseItemGap       = lerp(8, 4, t);   // 8px → 4px

            let scale = 1.0;

            if (!isVertical) {
                // Horizontal Mode: Height is highly constrained, width is shared by N teams.
                const scaleHeight = H / 60;
                
                // Available width per team card
                const availWidth = (W - 20 - (n - 1) * baseRowGap) / n;
                // Reference width where base fonts fit comfortably (reduced slightly to encourage larger scale)
                const refWidth = lerp(160, 90, t);
                const scaleWidth = availWidth / refWidth;
                
                // Allow the layout to scale up to 1.3x times scaleHeight if horizontal space permits
                scale = Math.min(scaleHeight * 1.3, scaleWidth);
                scale = Math.max(0.8, Math.min(3.0, scale));
            } else {
                // Vertical Mode: Width is shared by only 1 team (stacked vertically).
                // Available height for column layout
                const availHeight = H - 40; // Subtracting container vertical paddings
                const itemHeight = (availHeight - (n - 1) * baseRowGap) / n;
                const refHeight = 45; // Standard item height
                const scaleHeight = itemHeight / refHeight;

                const availWidth = W - 20; // Subtracting container horizontal paddings

                const scaleWidth = availWidth / refWidth;

                scale = Math.min(scaleHeight, scaleWidth);
                
                // Apply a 1.25x boost specifically in vertical mode to ensure highly visible, aesthetic large text
                scale = scale * 1.25;
                scale = Math.max(1.1, Math.min(3.0, scale));
            }

            const scoreFontSize = Math.round(baseScoreFontSize * scale);

        function hasScoresChanged(newScores) {

        function transformUrl(url) {
            try {
                const cleanUrl = url.trim();
                // Basic cleanup if needed, but fetchScores main logic handles most parsing now.
                // We keep this simple to avoid ReferenceError in startApp.
                return cleanUrl;
            } catch (e) {
                return url;
            }
        }

        // Helper to extract IDs from URL
        function parseSheetInfo(url) {
            try {
                const cleanUrl = url.trim();
                const idMatch = cleanUrl.match(/\/d\/([a-zA-Z0-9-_]+)/);
                if (!idMatch) return null;

                const id = idMatch[1];
                // 'e' is used for "Publish to Web" links, not a real Doc ID
                if (id === 'e') return null;

                let gid = '0';
                const gidMatch = cleanUrl.match(/[?&#]gid=([0-9]+)/);
                if (gidMatch) gid = gidMatch[1];

                return { docId: id, gid: gid };
            } catch (e) {
                return null;
            }
        }

        async function fetchScores() {
            // 1. Try to parse ID for smart URLs
            const sheetInfo = parseSheetInfo(CONFIG.appsScriptUrl);

            // 2. Handle Non-Standard IDs (Apps Script, Publish to Web, etc.)
            if (!sheetInfo) {
                let url = CONFIG.appsScriptUrl.trim();

                // Smart fix for "Publish to Web" HTML links
                if (url.includes('/pubhtml')) {
                    url = url.replace('/pubhtml', '/pub?output=csv');
                } else if (url.includes('/pub') && !url.includes('output=csv')) {
                    // Ensure output=csv is present if it's a general pub link
                    const separator = url.includes('?') ? '&' : '?';
                    url += separator + 'output=csv';
                }

                // Try fetching directly (fallback to old behavior)
                try {
                    const response = await fetchWithCacheBusting(url);
                    updateConnectionMode(false); // Consider simple fetch as "Delayed/Normal"
                    return response;
                } catch (e) {
                    // If this fails, throw specific error
                    throw new Error(`Direct fetch failed (${e.message}). Check URL.`);
                }
            }

            // 2. Strategy: Try GVIZ (Fast) -> Fail -> Try Export (Reliable)
            const cacheBuster = Math.random().toString(36).substring(7) + Date.now();

            // Constructs
            const gvizUrl = `https://docs.google.com/spreadsheets/d/${sheetInfo.docId}/gviz/tq?tqx=out:csv&gid=${sheetInfo.gid}&cb=${cacheBuster}`;
            const exportUrl = `https://docs.google.com/spreadsheets/d/${sheetInfo.docId}/export?format=csv&gid=${sheetInfo.gid}&cb=${cacheBuster}`;

            try {
                // Try GVIZ
                const response = await fetch(gvizUrl, { cache: 'no-store' });
                if (!response.ok) throw new Error('GVIZ failed');

                // If successful, update UI to show "Live Mode"
                updateConnectionMode(true);
                return processResponse(response);
            } catch (e) {
                console.warn("Fast connection failed, falling back to standard export...", e);

                // Fallback to Export
                const response = await fetch(exportUrl, { cache: 'no-store' });
                if (!response.ok) throw new Error(`Fallback failed: ${response.status}`);

                updateConnectionMode(false);
                return processResponse(response);
            }
        }

        async function fetchWithCacheBusting(url) {
            const cacheBuster = Math.random().toString(36).substring(7) + Date.now();
            const fetchUrl = url + (url.includes('?') ? '&' : '?') + 'cb=' + cacheBuster;
            const response = await fetch(fetchUrl, { cache: 'no-store' });
            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
            return processResponse(response);
        }

        async function processResponse(response) {
            const contentType = response.headers.get('content-type');

            if (contentType && contentType.includes('application/json')) {
                const data = await response.json();
                return parseJSON(data); // Expects array
            } else {
                const text = await response.text();
                try {
                    return parseJSON(JSON.parse(text));
                } catch (e) {
                    return parseCSV(text);
                }
            }
        }

        function updateConnectionMode(isFast) {
            const div = document.getElementById('lastUpdated');
            const now = new Date().toLocaleTimeString();
            const mode = isFast ? '⚡ LIVE' : '⚠️ DELAYED';
            div.textContent = `${mode} • ${now}`;
            div.style.color = isFast ? '#4ade80' : '#fde047'; // Green or Yellow
        }



        function parseJSON(data) {
            // Returns Array: [{name: "A", score: 10}, {name: "B", score: 5}]
            const results = [];

            if (Array.isArray(data)) {
                data.forEach(item => {
                    // Extract first two meaningful properties if standard format isn't found
                    const vals = Object.values(item);
                    if (vals.length >= 2) {
                        results.push({ name: String(vals[0]), score: Number(vals[1]) || 0 });
                    }
                });
            } else if (typeof data === 'object' && data !== null) {
                // If it's an object {Team1: 10}, convert to array respecting key order usually
                // But object key order isn't guaranteed. Best effort.
                Object.keys(data).forEach(key => {
                    results.push({ name: key, score: Number(data[key]) || 0 });
                });
            }
            return results;
        }

        function parseCSV(text) {
            // Returns Array: [{name: "A", score: 10}, ...]
            const results = [];

            const lines = text.split(/\r?\n/).filter(line => line.trim() !== '');
            if (lines.length === 0) return results;

            // Strategy: Check for Horizontal Format (Row 1 = Names, Row 2 = Scores)
            const splitLine = (line) => {
                // Proper CSV split: preserves empty cells and handles quoted values
                const result = [];
                let current = '';
                let inQuotes = false;
                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    if (char === '"') {
                        inQuotes = !inQuotes;
                    } else if (char === ',' && !inQuotes) {
                        result.push(current.trim());
                        current = '';
                    } else {
                        current += char;
                    }
                }
                result.push(current.trim());
                return result;
            };

            const headerRow = splitLine(lines[0]);

            // CHECK HORIZONTAL: If we have a second row that looks numeric
            if (lines.length >= 2) {
                const secondRow = splitLine(lines[1]);
                const numericCount = secondRow.filter(v => !isNaN(Number(v)) && v !== '').length;

                if (headerRow.length >= 2 && numericCount > 0) {
                    const count = Math.min(headerRow.length, secondRow.length);
                    for (let i = 0; i < count; i++) {
                        const name = headerRow[i];
                        const score = Number(secondRow[i]);
                        if (name && !isNaN(score)) {
                            results.push({ name: name, score: score });
                        }
                    }
                    return results;
                }
            }

            // FALLBACK: Vertical Format
            lines.forEach(line => {
                const parts = splitLine(line);
                if (parts.length >= 2) {
                    const name = parts[0];
                    const score = Number(parts[1]);
                    if (name && !isNaN(score)) {
                        results.push({ name: name, score: score });
                    }
                }
            });

            return results;
        }

            recognition.onerror = (event) => {

        function stopVoiceListening() {

            if (!isListening) return;
            try {
                recognition.stop();
            } catch (err) {
                console.error("Failed to stop voice recognition:", err);
            }
        }

        function toggleVoiceListening() {
            if (isListening) {
                stopVoiceListening();
            } else {
                startVoiceListening();
            }
        }

        // Click Trigger
        voiceToggleBtn.addEventListener('click', toggleVoiceListening);

        // Keyboard Triggers (Holding or Tapping 'V')
        window.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'v' && !e.repeat && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
                keydownTime = Date.now();
                if (!isListening) {
                    startVoiceListening();
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.key.toLowerCase() === 'v' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
                const pressDuration = Date.now() - keydownTime;
                if (pressDuration > 350) {
                    // Holding 'V' (Push-To-Talk) -> Stop and submit on keyup
                    stopVoiceListening();
                }
            }
        });

        // Numeric Word Lookup Table
        const numberWords = {
            "zero": 0, "one": 1, "two": 2, "three": 3, "four": 4, "five": 5, "six": 6, "seven": 7, "eight": 8, "nine": 9, "ten": 10,
            "eleven": 11, "twelve": 12, "thirteen": 13, "fourteen": 14, "fifteen": 15, "sixteen": 16, "seventeen": 17, "eighteen": 18, "nineteen": 19,
            "twenty": 20, "thirty": 30, "forty": 40, "fifty": 50, "sixty": 60, "seventy": 70, "eighty": 80, "ninety": 90, "hundred": 100
        };

        function parseSpokenNumber(text) {
            text = text.trim().toLowerCase();
            if (!isNaN(text)) return parseInt(text);

            const words = text.split(/[\s-]+/);
            let total = 0;
            let current = 0;

            for (const word of words) {
                if (numberWords[word] !== undefined) {
                    const val = numberWords[word];
                    if (val === 100) {
                        current = (current || 1) * 100;
                    } else {
                        current += val;
                    }
                }
            }
            return current + total;
        }

        // Natural Command Parser
        function parseVoiceCommand(transcript) {
            const text = transcript.toLowerCase().trim();
            console.log("Speech recognition heard:", text);

            // Pattern 1: "team 5 plus 10" or "team 2 set to 80"
            const pattern1 = /team\s+(\d+|[a-z\-]+)\s+(plus|add|minus|subtract|set|to)\s+(\d+|[a-z\-]+)/i;
            // Pattern 2: "set team 3 to 50"
            const pattern2 = /set\s+team\s+(\d+|[a-z\-]+)\s+(?:to\s+)?(\d+|[a-z\-]+)/i;
            // Pattern 3: "add 5 to team 2"
            const pattern3 = /(add|plus)\s+(\d+|[a-z\-]+)\s+to\s+team\s+(\d+|[a-z\-]+)/i;
            // Pattern 4: "subtract 5 from team 2"
            const pattern4 = /(subtract|minus)\s+(\d+|[a-z\-]+)\s+from\s+team\s+(\d+|[a-z\-]+)/i;

            let teamMatch = null;
            let action = null;
            let valueMatch = null;

            let match = text.match(pattern1);
            if (match) {
                teamMatch = match[1];
                action = match[2];
                valueMatch = match[3];
            } else {
                match = text.match(pattern2);
                if (match) {
                    teamMatch = match[1];
                    action = 'set';
                    valueMatch = match[2];
                } else {
                    match = text.match(pattern3);
                    if (match) {
                        action = 'add';
                        valueMatch = match[2];
                        teamMatch = match[3];
                    } else {
                        match = text.match(pattern4);
                        if (match) {
                            action = 'subtract';
                            valueMatch = match[2];
                            teamMatch = match[3];
                        }
                    }
                }
            }

            if (teamMatch && valueMatch) {
                const teamNum = parseSpokenNumber(teamMatch);
                const value = parseSpokenNumber(valueMatch);

                if (teamNum > 0 && teamNum <= CONFIG.teams.length) {
                    const teamName = CONFIG.teams[teamNum - 1];
                    applyVoiceUpdate(teamName, action, value);
                    return true;
                }
            }

            // Command unrecognized
            triggerVoiceFeedback(false);
            return false;
        }

        // Apply voice score update locally & sync to server
        function applyVoiceUpdate(teamName, action, value) {
            let currentScore = currentScores[teamName] || 0;
            let newScore = currentScore;

            if (action === 'add' || action === 'plus') {
                newScore = currentScore + value;
            } else if (action === 'subtract' || action === 'minus') {
                newScore = Math.max(0, currentScore - value);
            } else if (action === 'set' || action === 'to') {
                newScore = value;
            }

            // 1. Instant local render update
            currentScores[teamName] = newScore;
            renderScores({ ...currentScores });

            // 2. Play success flash animation
            triggerVoiceFeedback(true);

            // 3. Write background update to Google Apps Script
            if (CONFIG.appsScriptUrl && CONFIG.appsScriptUrl.includes('/exec')) {
                const syncUrl = CONFIG.appsScriptUrl + '?team=' + encodeURIComponent(teamName) + '&score=' + newScore + '&action=set';
                fetch(syncUrl, { mode: 'no-cors' })
                    .then(() => console.log(`Background voice sync success for ${teamName}: ${newScore}`))
                    .catch((e) => console.error("Background voice sync error:", e));
            }
        }

        // Flash screen indicator animations
        function triggerVoiceFeedback(success) {
            const feedbackClass = success ? 'voice-success' : 'voice-failure';
            appContainer.classList.add(feedbackClass);
            setTimeout(() => {
                appContainer.classList.remove(feedbackClass);
            }, 1000);
        }
        // --- End Voice Scoring Input Logic ---

        applyZoom();

        // Start the application
        init();
        applyDynamicScaling();

        // Window Controls
        if (window.electronAPI) {
            document.getElementById('minimizeBtn').addEventListener('click', () => {
                window.electronAPI.minimize();
            });

            document.getElementById('closeBtn').addEventListener('click', () => {
                window.electronAPI.close();
            });
        } else {
            // Hide only Electron-specific buttons in browser mode
            document.getElementById('minimizeBtn').style.display = 'none';
            document.getElementById('closeBtn').style.display = 'none';
        }
    </script>
</body>

</html>
